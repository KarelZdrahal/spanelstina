name: Sestavit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (předinstalované na runneru)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls $ANDROID_HOME/platforms

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sestavení webové části
        run: python3 web/build.py

      - name: Sestavení APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Přejmenování
        run: cp app/build/outputs/apk/release/app-release.apk Espanol.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Espanol-apk
          path: Espanol.apk

      - name: Zveřejnění ke stažení (Releases → latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Espanol.apk --title "Español – aktuální verze" --notes "Stáhni Espanol.apk do telefonu a otevři ho. Při aktualizaci se postup zachová." --target ${{ github.sha }}
